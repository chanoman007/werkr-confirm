<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werkr — Dejanos tu reseña</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }
    .logo-icon {
      width: 40px; height: 40px;
      background: #0066cc;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 22px; font-weight: 900;
    }
    .logo-text { font-size: 22px; font-weight: 700; color: #0066cc; }
    h2 { font-size: 18px; color: #1a1a2e; margin-bottom: 6px; }
    .sub { color: #888; font-size: 14px; margin-bottom: 24px; }
    label { display: block; font-size: 13px; color: #666; margin-bottom: 6px; margin-top: 16px; }
    input[type="text"], textarea {
      width: 100%; border: 1px solid #ddd; border-radius: 10px;
      padding: 12px; font-size: 15px; background: #fafafa; font-family: inherit;
    }
    textarea { min-height: 90px; resize: vertical; }
    .stars { display: flex; gap: 8px; margin-top: 6px; }
    .star {
      font-size: 34px; cursor: pointer; color: #ddd; user-select: none;
      transition: color 0.15s;
    }
    .star.active { color: #ffb400; }
    .btn {
      width: 100%; padding: 16px; border-radius: 12px;
      border: none; font-size: 16px; font-weight: 700;
      cursor: pointer; margin-top: 24px; background: #0066cc; color: #fff;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .resultado { text-align: center; padding: 24px 0; }
    .resultado-icon { font-size: 64px; margin-bottom: 16px; }
    .resultado-titulo { font-size: 22px; font-weight: 700; margin-bottom: 8px; color: #1a1a2e; }
    .resultado-sub { font-size: 15px; color: #888; }
    .loading, .error { text-align: center; padding: 40px; color: #888; }
    .error { color: #ff3b30; }
  </style>
</head>
<body>
<div class="card" id="app">
  <div class="loading">Cargando...</div>
</div>

<script>
  const getToken = () => {
    const parts = window.location.pathname.split('/');
    return parts[parts.length - 1];
  };

  const render = (html) => { document.getElementById('app').innerHTML = html; };

  const logo = `<div class="logo"><div class="logo-icon">W</div><span class="logo-text">Werkr</span></div>`;

  const mostrarGracias = () => {
    render(`
      ${logo}
      <div class="resultado">
        <div class="resultado-icon">🙏</div>
        <div class="resultado-titulo">¡Gracias por tu reseña!</div>
        <div class="resultado-sub">Tu opinión nos ayuda a seguir mejorando.</div>
      </div>
    `);
  };

  let puntajeSeleccionado = 0;

  const pintarEstrellas = () => {
    document.querySelectorAll('.star').forEach((el, i) => {
      el.classList.toggle('active', i < puntajeSeleccionado);
    });
  };

  const elegirEstrella = (n) => {
    puntajeSeleccionado = n;
    pintarEstrellas();
  };

  const enviar = async (token) => {
    const btn = document.getElementById('btnEnviar');
    const nombre = document.getElementById('nombre').value.trim();
    const comentario = document.getElementById('comentario').value.trim();

    if (!puntajeSeleccionado) { alert('Elegí un puntaje de 1 a 5 estrellas'); return; }

    btn.disabled = true;
    btn.textContent = 'Enviando...';
    try {
      const res = await fetch('/api/resena', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          token,
          cliente_nombre: nombre,
          puntaje: puntajeSeleccionado,
          comentario,
        }),
      });
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        if (res.status === 409) { mostrarGracias(); return; }
        throw new Error(data.error || 'Error al enviar');
      }
      mostrarGracias();
    } catch (e) {
      alert('No se pudo enviar tu reseña. Intentá de nuevo.');
      btn.disabled = false;
      btn.textContent = '⭐ Enviar reseña';
    }
  };

  const renderForm = (token, clienteNombre) => {
    render(`
      ${logo}
      <h2>¿Cómo fue tu experiencia?</h2>
      <div class="sub">Tu opinión nos ayuda a seguir mejorando.</div>

      <label>Tu nombre</label>
      <input type="text" id="nombre" value="${clienteNombre ? clienteNombre.replace(/"/g, '&quot;') : ''}" placeholder="Nombre y apellido">

      <label>Puntaje</label>
      <div class="stars" id="stars">
        ${[1,2,3,4,5].map(n => `<span class="star" data-n="${n}">★</span>`).join('')}
      </div>

      <label>Comentario (opcional)</label>
      <textarea id="comentario" placeholder="Contanos cómo te fue..."></textarea>

      <button class="btn" id="btnEnviar">⭐ Enviar reseña</button>
    `);

    document.querySelectorAll('.star').forEach(el => {
      el.addEventListener('click', () => elegirEstrella(Number(el.dataset.n)));
    });
    document.getElementById('btnEnviar').addEventListener('click', () => enviar(token));
  };

  const init = async () => {
    const token = getToken();
    if (!token || token === 'resena') {
      render('<div class="error">Link inválido.</div>');
      return;
    }

    try {
      const res = await fetch('/api/resena?token=' + encodeURIComponent(token));
      if (!res.ok) {
        render('<div class="error">No encontramos esta reseña. El link puede haber expirado.</div>');
        return;
      }
      const data = await res.json();
      if (data.completada) { mostrarGracias(); return; }
      renderForm(token, data.cliente_nombre);
    } catch (e) {
      render('<div class="error">No se pudo cargar. Intentá de nuevo.</div>');
    }
  };

  init();
</script>
</body>
</html>
